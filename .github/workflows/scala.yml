# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "master" ]
    # A pushed tag is a published version: build native binaries and attach
    # them to the corresponding GitHub Release below.
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: table-linux
          - os: macos-latest
            binary: table-macos
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: VirtusLab/scala-cli-setup@v1.4.3
    - name: Run tests
      run: scala-cli test . -S 3.4.1
    - name: Build native executable
      run: scala-cli --power package --native . -S 3.4.1 -o "${{ matrix.binary }}" --force
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.binary }}
        path: ${{ matrix.binary }}
        if-no-files-found: error

  release:
    # Only tags publish a release; branch and pull-request builds still test
    # both supported operating systems.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download release binaries
      uses: actions/download-artifact@v4
      with:
        pattern: table-*
        path: dist
        merge-multiple: true
    - name: Create or update GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: dist/table-linux,dist/table-macos
        artifactErrorsFailBuild: true
        allowUpdates: true
        replacesArtifacts: true
        generateReleaseNotes: true
        token: ${{ github.token }}
